<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow"><title>Surfski simulation</title>
<meta name="theme-color" content="#0a2a52"><link rel="icon" href="./favicon.svg">
<style>:root{--lightningcss-light: ;--lightningcss-dark:initial;color-scheme:dark}html{background:#0a2a52}body{color:#eaf3ff;background:linear-gradient(#0f3a6b 0,#0a2a52 340px,#082244 100%);margin:0;font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}header{max-width:1100px;margin:0 auto;padding:34px 22px 8px}h1{margin:0 0 6px;font-size:34px;font-weight:650}.lead{opacity:.92;max-width:60ch;margin:0;font-size:18px}.keys{opacity:.8;margin:12px 0 0;font-size:14px}kbd{background:#ffffff29;border:1px solid #ffffff4d;border-bottom-width:2px;border-radius:5px;padding:0 6px;font:13px ui-monospace,monospace}main{grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:22px;max-width:1100px;margin:0 auto;padding:12px 22px 50px;display:grid}.card{background:#ffffff12;border-radius:12px;flex-direction:column;display:flex;overflow:hidden}.shot{aspect-ratio:16/9;display:block;position:relative;overflow:hidden}.shot img{object-fit:cover;width:100%;height:100%;transition:transform .5s;display:block}.shot:hover img{transform:scale(1.04)}.play{background:#0a2a52cc;border-radius:8px;padding:6px 14px;font-weight:600;position:absolute;bottom:12px;right:12px}.body{flex-direction:column;flex:1;padding:14px 18px 18px;display:flex}h2{margin:0;font-size:22px}h3{text-transform:uppercase;letter-spacing:.08em;color:#bfe3ff;margin:10px 0 2px;font-size:13px}.sub{color:#8fd0ff;margin:2px 0 8px;font-size:14px}p{margin:6px 0}ul{margin:8px 0 14px;padding-left:20px}li{margin:2px 0}.btn{color:#fff;background:#2b8cff;border-radius:8px;align-self:flex-start;margin-top:auto;padding:9px 18px;font-weight:600;text-decoration:none}.btn:hover{background:#4aa0ff}footer{opacity:.75;max-width:1100px;margin:0 auto;padding:0 22px 40px;font-size:14px}a{color:#8fd0ff}@media (width<=520px){main{grid-template-columns:1fr}}</style></head><body>
<header><h1>Surfski simulation</h1>
<p class="lead">Realistic open water paddling.</p>
<p class="keys"><kbd>Space</kbd> start/pause · <kbd>←</kbd><kbd>→</kbd> steer · <kbd>↑</kbd> paddle harder · <kbd>↓</kbd> reduce power, brace · <kbd>V</kbd> change camera · <kbd>P</kbd> settings panel</p></header>
<main id="cards"></main>
<footer><a href="./about.html">About the simulator</a> · <a href="./sim.html">Open the full simulator and pick your own</a></footer>
<script>
// The cards are read from landing/index.json (the order) and landing/<id>.json (title, subtitle, blurb, notes, image, query): edit those files to change the page.
// "query" is the part of the simulator address after sim.html? that sets the scenario, sea, paddler, camera, time of day and weather.
const esc = (t) => String(t).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const get = (f) => fetch('./landing/' + f).then((r) => { if (!r.ok) throw new Error(f); return r.json(); });
get('index.json').then((idx) => Promise.all(idx.cards.map((id) => get(id + '.json')))).then((cards) => {
  document.getElementById('cards').innerHTML = cards.map((c, i) => {
    const href = './sim.html?' + esc(c.query) + '&amp;panel=0';      // panel=0: the settings panel starts closed (P opens it)
    return `<article class="card"><a class="shot" href="${href}"><img src="./landing/${esc(c.image)}" alt="${esc(c.title)}" loading="${i < 2 ? 'eager' : 'lazy'}"><span class="play">▶ Start</span></a>
<div class="body"><h2>${esc(c.title)}</h2><p class="sub">${esc(c.subtitle)}</p><p>${esc(c.blurb)}</p><ul>${c.notes.map((n) => `<li>${esc(n)}</li>`).join('')}</ul><a class="btn" href="${href}">▶ Let's go!</a></div></article>`;
  }).join('');
}).catch((e) => { document.getElementById('cards').textContent = 'Could not load the cards (' + e.message + ').'; });
</script>
</body></html>
