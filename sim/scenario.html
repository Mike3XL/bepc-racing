<!doctype html>
<html lang="en">
<head>
  <meta name="robots" content="noindex, nofollow">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Surfski downwind sim</title>
  <style>html,body{color:#fff;background:#0a2a52;height:100%;margin:0;font-family:system-ui,sans-serif;overflow:hidden}#gl{width:100vw;height:100vh;display:block;position:fixed;inset:0}#v2d{background:#0a2a52;position:fixed}#v2d.full{width:100vw;height:100vh;inset:0}#v2d.inset{border:2px solid #ffffffb3;border-radius:8px;width:min(30vw,420px);height:min(30vw,420px);bottom:96px;right:12px;box-shadow:0 4px 18px #0006}#v2d.off{display:none}#hud{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);background:#051428a8;border-radius:8px;width:330px;padding:10px 14px;font-size:13px;line-height:1.45;position:fixed;top:12px;left:12px}#hud h1{margin:0 0 4px;font-size:14px}#hud .notes{opacity:.85;margin-bottom:6px;font-size:12px}#hud .big{font-size:32px;font-weight:700;line-height:1.1}#hud small{font-size:14px;font-weight:400}#hud .warn{color:#ffb36b;font-weight:600}#hud .run{color:#7dffa1;font-weight:600}#timeline{background:#051428b8;border-radius:8px;align-items:center;gap:10px;padding:8px 12px;display:flex;position:fixed;bottom:12px;left:12px;right:12px}#timeline button{color:#fff;cursor:pointer;background:#1e4d7a;border:0;border-radius:6px;padding:6px 10px;font-size:13px}#timeline button:hover{background:#2b6aa5}#track{flex:1;height:34px;position:relative}#track input{width:100%;margin:0;position:absolute;top:6px;left:0;right:0}#track .mark{pointer-events:none;width:2px;height:34px;position:absolute;top:0}#track .mark span{white-space:nowrap;font-size:10px;position:absolute;top:24px;left:4px}#time{font-variant-numeric:tabular-nums;min-width:150px}#power{-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);pointer-events:none;background:#051428a8;border-radius:8px;width:360px;padding:6px 10px;font-size:12px;position:fixed;bottom:72px;left:50%;transform:translate(-50%)}#power .row{align-items:center;gap:10px;display:flex}#power .bar{background:#ffffff24;border-radius:7px;flex:1;height:14px;position:relative;overflow:hidden}#power .bar.thin{border-radius:3px;height:6px}#rfill{border-radius:3px;width:100%;position:absolute;top:0;bottom:0;left:0}#pfill{border-radius:7px;width:0;position:absolute;top:0;bottom:0;left:0}#pbase{opacity:.9;background:#fff;width:2px;position:absolute;top:-2px;bottom:-2px;left:44.9%}#ptxt{text-align:right;font-variant-numeric:tabular-nums;min-width:52px;font-weight:600}#power .lab{opacity:.65;justify-content:space-between;margin-top:2px;font-size:10px;display:flex}#banner{color:#1a1000;background:#ffaa28f0;border-radius:8px;padding:8px 18px;font-weight:600;display:none;position:fixed;top:16px;left:50%;transform:translate(-50%)}.lil-gui.root{max-height:70vh;position:fixed;top:12px;right:12px;overflow:auto}</style>
  <script type="module" crossorigin src="./assets/scenario-AlMNWo9s.js"></script>
  <link rel="modulepreload" crossorigin href="./assets/fetch-Xj43Ir9V.js">
</head>
<body>
  <canvas id="gl"></canvas>
  <canvas id="v2d" class="inset"></canvas>
  <div id="hud"></div>
  <div id="power">
    <div class="row"><div class="bar"><div id="pfill"></div><div id="pbase" title="baseline power"></div></div><div id="ptxt">0 W</div></div>
    <div class="lab" id="plab"></div>
    <div class="row" style="margin-top:4px"><div class="bar thin"><div id="rfill"></div></div><div id="rtxt" style="min-width:90px;text-align:right;opacity:.8">reserve 100%</div></div>
  </div>
  <div id="banner"></div>
  <div id="timeline">
    <button id="restart" title="Back to start">⏮</button>
    <button id="back" title="Back 0.5 s">⏪</button>
    <button id="play">▶ Resume</button>
    <button id="fwd" title="Forward 0.5 s">⏩</button>
    <button id="markin" title="Mark clip start (I)">Mark in</button>
    <button id="markout" title="Mark clip end (O)">Mark out</button>
    <button id="saveclip" title="Save the marked stretch as a clip (C)">Save clip</button>
    <button id="loadclip" title="Load a saved clip">Load clip</button>
    <input id="clipfile" type="file" accept="application/json,.json" style="display:none" />
    <div id="track"><input id="scrub" type="range" min="0" max="20" step="0.02" value="0" /></div>
    <div id="time">0.0 / 20.0 s</div>
  </div>
  <div id="credit" style="position:fixed;left:14px;bottom:1px;font:10px system-ui,sans-serif;color:#fff;opacity:.55;pointer-events:none">Coastline data © OpenStreetMap contributors</div>
</body>
</html>
