name: Process Results (Monday Night Poll)

# BEPC races run every Monday: Reg 6PM, Start 7PM PDT. Rather than relying on
# GitHub's cron scheduling (which we've observed drops/delays most ticks in a
# tight */15 window — see git history), this runs ONE job that starts 45min
# after race start and polls WebScorer every few minutes until results appear.
# As soon as results are found, it fetches, builds, publishes, sends exactly
# one email, and exits — no further polling. If results never show up within
# the time budget, it gives up quietly and the daily backstops in
# process-results-background.yml will catch it later.

on:
  schedule:
    # Monday 7:45 PM PDT = Tue 02:45 UTC — 45min after 7PM race start.
    - cron: '45 2 * * 2'
  workflow_dispatch:

jobs:
  poll-for-results:
    runs-on: ubuntu-latest
    timeout-minutes: 300  # hard stop well past our own give-up point, as a safety net
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Poll until results appear
        id: process
        env:
          WEBSCORER_API_ID: ${{ secrets.WEBSCORER_API_ID }}
          WEBSCORER_API_TOKEN: ${{ secrets.WEBSCORER_API_TOKEN }}
          GITHUB_ACTIONS: 'true'
        run: |
          POLL_INTERVAL_SECONDS=180   # 3 minutes between checks
          GIVE_UP_AFTER_SECONDS=14400 # 4 hours (~7:45PM to midnight PDT)
          start_ts=$(date +%s)
          fetched=false
          cleanup=false
          summary=""

          while true; do
            output=$(python cli.py process-results pnw 2>&1)
            echo "$output"

            if echo "$output" | grep -q "Fetched "; then
              fetched=true
              summary=$(echo "$output" | grep -E "Fetched |Removed |results available")
              break
            fi
            if echo "$output" | grep -q "already-processed"; then
              cleanup=true
            fi

            elapsed=$(( $(date +%s) - start_ts ))
            if [ "$elapsed" -ge "$GIVE_UP_AFTER_SECONDS" ]; then
              echo "Gave up after $((elapsed / 60)) minutes — no results yet. Daily backstops will retry."
              break
            fi

            echo "No results yet (elapsed ${elapsed}s) — sleeping ${POLL_INTERVAL_SECONDS}s before retry..."
            sleep "$POLL_INTERVAL_SECONDS"
          done

          echo "fetched=$fetched" >> "$GITHUB_OUTPUT"
          echo "cleanup=$cleanup" >> "$GITHUB_OUTPUT"
          echo "summary<<EOF" >> "$GITHUB_OUTPUT"
          echo "$summary" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Commit fetched data to main
        if: steps.process.outputs.fetched == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && echo "Nothing to commit" || (git commit -m "data: auto-fetch race results [skip ci]" && git push)

      - name: Commit upcoming.yaml cleanup to main
        if: steps.process.outputs.fetched != 'true' && steps.process.outputs.cleanup == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/upcoming.yaml
          git diff --cached --quiet && echo "Nothing to commit" || (git commit -m "data: remove already-processed races from upcoming.yaml [skip ci]" && git push)

      - name: Deploy to GitHub Pages
        if: steps.process.outputs.fetched == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          commit_message: 'chore: auto-publish results'

      - name: Email on success
        if: steps.process.outputs.fetched == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: mike.liddell@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: mike.liddell@gmail.com
          from: BEPC Racing <mike.liddell@gmail.com>
          subject: 'BEPC: New race results published'
          body: |
            New results were fetched and published to https://pnw.paddlerace.org/

            ${{ steps.process.outputs.summary }}

      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: mike.liddell@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          to: mike.liddell@gmail.com
          from: BEPC Racing <mike.liddell@gmail.com>
          subject: 'BEPC: Monday poll job failed'
          body: |
            The Monday night polling workflow failed.
            Check: https://github.com/Mike3XL/bepc-racing/actions
